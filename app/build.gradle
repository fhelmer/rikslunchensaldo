apply plugin: 'com.android.application'

android {
    compileSdkVersion 21

    defaultConfig {
        applicationId "se.helmer.rikslunchensaldo"
        minSdkVersion 15
        targetSdkVersion 28
        versionCode 26
        versionName "1.26"
    }
    buildTypes {
        release {
            apply plugin: 'findbugs'
        }
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'com.android.support:support-v13:21.0.2'
    api 'com.google.android.gms:play-services:4.2.42'
    api 'com.j256.ormlite:ormlite-core:4.48'
    api 'com.j256.ormlite:ormlite-android:4.48'
    api 'com.tojc.ormlite.android:ormlite-content-provider-library:1.0.4'
    testImplementation 'junit:junit:4.12'
}
